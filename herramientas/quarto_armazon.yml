# armazón web del libro — PLANTILLA (única copia editable), con el
# formato de la colección medido sobre RCienciaDeDatos (norma del
# autor, 2026-08-04, para todos los libros).
# El Makefile la copia a qmd/_quarto.yml en cada `make qmd`: el
# proyecto Quarto vive en qmd/ y la salida queda PLANA en docs/.
# Al terminar un capítulo: sustituir su entrada `text:` por el .qmd
# (aquí y en index_base.md).

project:
  type: website
  output-dir: ../docs

website:
  title: "Privacidad · Ciencia de datos"
  reader-mode: true
  page-navigation: true
  search:
    location: sidebar
    type: textbox
  sidebar:
    style: docked
    collapse-level: 1
    contents:
      - text: "Inicio"
        href: index.qmd
      - cap01.qmd
      - text: "2. Ataques a la privacidad (en preparación)"
      - text: "3. Cuantificar el riesgo (en preparación)"
      - text: "4. Seudonimización y anonimización clásica (en preparación)"
      - text: "5. Privacidad diferencial (en preparación)"
      - text: "6. DP en el entrenamiento (en preparación)"
      - text: "7. Privacidad diferencial local (en preparación)"
      - text: "8. Datos sintéticos (en preparación)"
      - text: "9. Aprendizaje federado (en preparación)"
      - text: "10. Computación cifrada (en preparación)"
      - text: "11. Biometría (en preparación)"
      - text: "12. Dato de salud e imagen médica (en preparación)"
      - text: "13. Procedencia y autenticidad (en preparación)"
      - text: "14. RGPD operativo (en preparación)"
      - text: "15. AI Act y gobernanza de modelos (en preparación)"
      - text: "16. Privacy by design en arquitectura (en preparación)"
      - text: "17. Caso integral (en preparación)"
  page-footer:
    border: true
    center: |
      © 2026 Manuel Muñoz Plá · Edición web bajo licencia [CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-nd/4.0/deed.es) (uso académico con atribución; sin uso comercial ni obras derivadas) · El código va aparte bajo licencia MIT · [Ficha del libro en manpla.net](https://manpla.net/libros/privacidad-ciencia-datos/)

bibliography: ../latex/referencias.bib

# sitio estático generado desde el LaTeX: NUNCA ejecutar chunks (los
# bloques de código que aparecen son EJEMPLOS del libro, no código vivo)
engine: markdown
execute:
  enabled: false

format:
  html:
    theme:
      - cosmo
      - estilo.scss
    toc: true
    toc-title: "En esta página"
    number-sections: false
    code-copy: true
    code-overflow: wrap
    fig-align: center
    html-math-method: mathjax

lang: es
